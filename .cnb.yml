$:
    vscode:
        - docker:
            image: docker.cnb.cool/xmzzuzhi/cnb-docker/python:0.0.1
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Claude.yml
          runner:
            cpus: 64
          services:
            - vscode
            - docker
          stages:
              - name: 授予install_gpg_keys.sh权限
                script:
                    - chmod +x /workspace/install_gpg_keys.sh
              - name: 安装claude CLI
                script:
                    - npm install -g @anthropic-ai/claude-code
                    - echo "claude CLI安装完成"
              - name: 安装qwen CLI
                script:
                    - npm install -g @qwen-code/qwen-code@latest
                    - echo "qwen CLI安装完成"
              - name: 安装CodeBuddy CLI
                script:
                    - npm install -g @tencent-ai/codebuddy-code
                    - echo "CodeBuddy CLI安装完成"
              - name: 安装Qoder CLI
                script:
                  - curl -fsSL https://qoder.com/install | bash
                  - echo "Qoder CLI安装完成"
              # 安装 Snyk CLI：官方独立二进制 + GPG 验签 + SHA-256 校验。
              # 具体校验与安装步骤见 scripts/install_snyk_cli.sh，避免 .cnb.yml 过长。
              - name: 安装Snyk CLI（校验签名后安装）
                script:
                    - chmod +x /workspace/scripts/install_snyk_cli.sh
                    - /workspace/scripts/install_snyk_cli.sh
              - name: 安装sudo更新APT源
                script:
                    - sudo apt-get update
                    - sudo apt-get install -y lsof net-tools jq
                    - echo "依赖完成"
              - name: 安装Git LFS
                script:
                    - sudo apt-get install -y git-lfs
                    - git lfs install
                    - echo "Git LFS安装完成"
              - name: 创建codebuddy配置文件夹
                script:
                    - mkdir -p /root/.codebuddy
                    - curl -o /root/.codebuddy/models.json https://cnb-1329111128.cos.ap-guangzhou.myqcloud.com/codebuddy.json
                    - echo "已创建 root/.codebuddy 文件夹并下载 models.json"
              # AstrBot 宿主一律取自上游官方源码（github.com/AstrBotDevs/AstrBot），
              # 不再用 pip 装 PyPI 上的 astrbot，避免与上游代码形态/版本漂移：
              #   - /workspace/AstrBot 是源码目录，供开发期阅读与 IDE 跳转；
              #   - 再以 editable 方式装进当前 Python 环境，main.py 的导入才能成立。
              # 只保留一份克隆副本，不再「克隆到 /tmp 再 cp 一遍」重复拉取。
              - name: 拉取AstrBot官方源码
                script:
                    - |
                      for i in 1 2 3; do
                        git clone --depth 1 https://github.com/AstrBotDevs/AstrBot.git /workspace/AstrBot && break
                        echo "第 $i 次克隆失败，10 秒后重试"; rm -rf /workspace/AstrBot; sleep 10
                      done
                      test -d /workspace/AstrBot/astrbot || { echo "❌ AstrBot 源码拉取失败"; exit 1; }
                      echo "AstrBot 源码已就位"
              - name: 安装AstrBot源码依赖
                script:
                    - pip install --upgrade pip
                    - pip install -e /workspace/AstrBot
                    - python -c "import astrbot; print('astrbot 导入成功:', astrbot.__file__)"

main:
      # CNB 是主仓，PR 分支不会同步到 GitHub 镜像，因此 PR 门禁必须在 CNB 侧跑。
      # 这里只跑最小检查集（代码规范 + 单测），3.13/3.14/3.15 矩阵、覆盖率上报、
      # CodeQL 等仍由 GitHub Actions 负责；push 到 main 时只做镜像同步。
      # 注意：以上只是「跑检查」，要真正阻止合并还需在仓库设置中把 main 设为
      # 保护分支并开启「需要通过状态检查」。
      pull_request:
        - docker:
            image: docker.cnb.cool/xmzzuzhi/cnb-docker/python:0.0.1
          runner:
            cpus: 4
          stages:
            - name: 安装 AstrBot 宿主与依赖
              # 整段放在同一个 script 块里：CNB 会把 script 数组用 && 拼接，
              # 多行 for 循环与后续命令拼在一起会产生 "&& unexpected" 语法错误。
              script:
                    - |
                      set -e
                      pip install --upgrade pip
                      for i in 1 2 3; do
                        git clone --depth 1 https://github.com/AstrBotDevs/AstrBot.git /tmp/AstrBot && break
                        echo "第 $i 次克隆失败，10 秒后重试"
                        rm -rf /tmp/AstrBot
                        sleep 10
                      done
                      test -d /tmp/AstrBot/astrbot || { echo "❌ AstrBot 源码拉取失败"; exit 1; }
                      pip install -e /tmp/AstrBot
                      pip install -r requirements-dev.txt
            - name: 代码规范检查
              script:
                    - pip install pre-commit
                    - pre-commit run --all-files
            - name: 单元测试与覆盖率
              # 整段放在同一个 script 块里，避免 CNB 用 && 拼接数组项时
              # 把多行内容与后续命令拼坏（同「安装宿主」阶段的坑）。
              script:
                    - |
                      set -e
                      python -m tests.run_coverage
                      # testing:coverage 不支持 coverage.py 的 XML，改由 lcov 上报；
                      # coverage>=7 支持该子命令，沿用 pyproject 的 source/omit 口径。
                      coverage lcov -o lcov.info
                      # testing:coverage 要求每条记录都带 LF/LH；coverage.py 会为零语句
                      # 文件（如 __init__.py）输出不带 LF 的空记录，导致汇总变 NaN。
                      # 按 end_of_record 拆分，只保留含 LF 的记录。
                      awk 'BEGIN { RS="end_of_record"; ORS="end_of_record\n" } /LF:/ { print }' lcov.info > lcov.filtered.info
                      mv lcov.filtered.info lcov.info
            - name: 上报单测覆盖率
              type: testing:coverage
              options:
                    pattern: lcov.info
                    # 报告缺失说明上游步骤没产出，直接失败，避免「静默不上报」。
                    breakIfNoCoverage: true
      # push 到 main：只把代码同步到 GitHub 镜像仓库。
      # 单测覆盖率、Release 与插件 zip 打包统一由 GitHub Actions 产出
      # （.github/workflows/coverage.yml、release.yml），CNB 不再重复构建 zip。
      push:
        - services:
            - docker
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Github.yml
          stages:
            - name: 同步到GitHub
              image: tencentcom/git-sync
              settings:
                target_url: https://github.com/xiaomizhoubaobei/astrbot_plugin_ots_memory.git
                auth_type: https
                username: ${GIT_USERNAME}
                password: ${GIT_ACCESS_TOKEN}
                branch: main
                # 强制覆盖镜像：镜像仓库以 CNB 侧为准，分叉时用 --force 覆盖（见 git-sync 的 PLUGIN_FORCE）
                force: true
                git_user: ${GIT_USERNAME}
                git_email: ${GIT_EMAIL}
