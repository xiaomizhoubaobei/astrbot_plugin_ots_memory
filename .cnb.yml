$:
    vscode:
        - docker:
            image: docker.cnb.cool/xmzzuzhi/cnb-docker/python:0.0.1
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Claude.yml
          runner:
            cpus: 32
          services:
            - vscode
            - docker
          stages:
              - name: 授予install_gpg_keys.sh权限
                script:
                    - chmod +x /workspace/install_gpg_keys.sh
              - name: 安装claude CLI
                script:
                    - npm install -g @anthropic-ai/claude-code
                    - echo "claude CLI安装完成"
              - name: 安装qwen CLI
                script:
                    - npm install -g @qwen-code/qwen-code@latest
                    - echo "qwen CLI安装完成"
              - name: 安装CodeBuddy CLI
                script:
                    - npm install -g @tencent-ai/codebuddy-code
                    - echo "CodeBuddy CLI安装完成"
              - name: 安装Qoder CLI
                script:
                  - curl -fsSL https://qoder.com/install | bash
                  - echo "Qoder CLI安装完成"
              - name: 安装sudo更新APT源
                script:
                    - sudo apt-get update
                    - sudo apt-get install -y lsof net-tools jq
                    - echo "依赖完成"
              - name: 安装Git LFS
                script:
                    - sudo apt-get install -y git-lfs
                    - git lfs install
                    - echo "Git LFS安装完成"
              - name: 创建codebuddy配置文件夹
                script:
                    - mkdir -p /root/.codebuddy
                    - curl -o /root/.codebuddy/models.json https://cnb-1329111128.cos.ap-guangzhou.myqcloud.com/codebuddy.json
                    - echo "已创建 root/.codebuddy 文件夹并下载 models.json"
              # AstrBot 宿主一律取自上游官方源码（github.com/AstrBotDevs/AstrBot），
              # 不再用 pip 装 PyPI 上的 astrbot，避免与上游代码形态/版本漂移：
              #   - /workspace/AstrBot 是源码目录，供开发期阅读与 IDE 跳转；
              #   - 再以 editable 方式装进当前 Python 环境，main.py 的导入才能成立。
              # 只保留一份克隆副本，不再「克隆到 /tmp 再 cp 一遍」重复拉取。
              - name: 拉取AstrBot官方源码
                script:
                    - |
                      for i in 1 2 3; do
                        git clone --depth 1 https://github.com/AstrBotDevs/AstrBot.git /workspace/AstrBot && break
                        echo "第 $i 次克隆失败，10 秒后重试"; rm -rf /workspace/AstrBot; sleep 10
                      done
                      test -d /workspace/AstrBot/astrbot || { echo "❌ AstrBot 源码拉取失败"; exit 1; }
                      echo "AstrBot 源码已就位"
              - name: 安装AstrBot源码依赖
                script:
                    - pip install --upgrade pip
                    - pip install -e /workspace/AstrBot
                    - python -c "import astrbot; print('astrbot 导入成功:', astrbot.__file__)"

main:
      # 注意：本仓库已移除 CNB 侧的覆盖率上报（原「覆盖率测试 + testing:coverage」作业）。
      # 单元测试覆盖率现统一由 GitHub 侧 .github/workflows/coverage.yml 产出并上报 Codecov，
      # 徽章见 README 顶部。CNB 侧仅保留「同步到 GitHub」作业。
      push:
        - services:
            - docker
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Github.yml
          stages:
            - name: 同步到GitHub
              image: tencentcom/git-sync
              settings:
                target_url: https://github.com/xiaomizhoubaobei/astrbot_plugin_ots_memory.git
                auth_type: https
                username: ${GIT_USERNAME}
                password: ${GIT_ACCESS_TOKEN}
                branch: main
                # 强制覆盖镜像：镜像仓库以 CNB 侧为准，分叉时用 --force 覆盖（见 git-sync 的 PLUGIN_FORCE）
                force: true
                git_user: ${GIT_USERNAME}
                git_email: ${GIT_EMAIL}

      # --- 发布包（zip）打包：只装插件运行所需文件 ---
      # 发布包边界见 .cnb-package-ignore（与 GitHub Actions release.yml 共用同一份忽略清单），
      # 个人工程化资产（AGENTS.md / install_gpg_keys.sh / ai-audit / .github 等）
      # 不会被 AstrBot 加载，也不该随插件装进使用者目录。
      push:
        - imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Package.yml
          stages:
            - name: 打包插件 zip
              script: |
                set -euo pipefail
                VERSION=$(grep '^version:' metadata.yaml | awk '{print $2}')
                VERSION=${VERSION#v}
                PLUGIN_NAME=$(grep '^name:' metadata.yaml | awk '{print $2}')
                PKG_DIR=".pkg/${PLUGIN_NAME}"
                ARTIFACT="${PLUGIN_NAME}-v${VERSION}.zip"

                rm -rf .pkg "${ARTIFACT}"
                mkdir -p "${PKG_DIR}"

                # 运行必需文件：缺失即失败，避免产出残缺包却发布成功
                cp main.py __init__.py client.py metadata.yaml requirements.txt _conf_schema.json "${PKG_DIR}/"
                # logo 可选，缺失不影响插件运行
                cp logo.png "${PKG_DIR}/" 2>/dev/null || true

                # 按 .cnb-package-ignore 过滤：清单是发布包边界的唯一来源（头注释有取舍标准）。
                # 打包目录里只有上面复制进来的文件，故直接用 zip -x 过滤即可，
                # 且 -x 只作用于被加入的路径，不会误伤同名文件。
                ZIP_EXCLUDES=()
                while IFS= read -r entry; do
                  case "${entry}" in
                    ''|'#'*) continue ;;
                  esac
                  ZIP_EXCLUDES+=(-x "${PLUGIN_NAME}/${entry}" "${PLUGIN_NAME}/${entry}/*")
                done < .cnb-package-ignore
                (cd .pkg && zip -r "../${ARTIFACT}" "${PLUGIN_NAME}/" "${ZIP_EXCLUDES[@]}")

                echo "== 发布包内容 =="
                unzip -l "${ARTIFACT}"
                echo "✅ 打包完成: ${ARTIFACT} ($(du -h "${ARTIFACT}" | cut -f1))"
                printf '%s' "${ARTIFACT}" > .pkg-artifact-name
            - name: 校验发布包边界
              script: |
                set -euo pipefail
                PLUGIN_NAME=$(grep '^name:' metadata.yaml | awk '{print $2}')
                ARTIFACT=$(cat .pkg-artifact-name)

                # 逐个断言忽略清单里的条目都不在包内，避免"改了清单忘了同步"静默漏包
                while IFS= read -r entry; do
                  case "${entry}" in
                    ''|'#'*) continue ;;
                  esac
                  if unzip -l "${ARTIFACT}" | awk '{print $4}' | grep -qx "${PLUGIN_NAME}/${entry}" \
                    || unzip -l "${ARTIFACT}" | awk '{print $4}' | grep -q "^${PLUGIN_NAME}/${entry}/"; then
                    echo "❌ 发布包内混入了应忽略的条目: ${entry}"
                    exit 1
                  fi
                done < .cnb-package-ignore

                # 运行必需文件必须在包内
                for required in main.py __init__.py client.py metadata.yaml requirements.txt _conf_schema.json; do
                  unzip -l "${ARTIFACT}" | awk '{print $4}' | grep -qx "${PLUGIN_NAME}/${required}" \
                    || { echo "❌ 发布包缺少必需文件: ${required}"; exit 1; }
                done
                echo "✅ 发布包边界校验通过"
