# 仅承载工具配置（非打包元数据）：本仓库是 AstrBot 插件，通过目录名作为包名被宿主加载，
# 不发布到 PyPI，故此处不声明 [project]/[build-system]，避免误引入打包语义。
[tool.pytest.ini_options]
# 异步测试直接写 `async def`，无需逐个打 @pytest.mark.asyncio
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# 裸跑口径：用**文件系统路径**而非包名计数。
# 包名口径依赖「包在 coverage 启动前已经可导入」，而裸跑 `coverage run -m pytest`
# 时包视图由 conftest/pytest 才建立，coverage 在启动阶段解析 source 会解析不到包，
# 于是静默写出空报告。路径口径没有这个先后依赖（CI 走 tests.run_coverage，
# 那里显式传 --source=<包名> 以命令行优先）。
# 注意：SF 由此写成相对检出根的 `client.py` / `main.py`，与下方 Codecov 路径一致。
source = ["."]

[tool.coverage.report]
# tests 与 ai-audit（纯模板/示例资产，不被单测覆盖）不计入分母
omit = ["tests/*", "ai-audit/*"]

[tool.mypy]
# 仓库根即包根（`__init__.py` 在根）。不声明 base 时 mypy 会把 tests/ 同时算作
# 「workspace.tests.*」与「tests.*」两套模块名，报 source file found twice。
explicit_package_bases = true
mypy_path = ".."
ignore_missing_imports = true
