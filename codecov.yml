# Codecov 配置：覆盖率报告口径与门禁策略
# 说明：本项目覆盖率由 .github/workflows/coverage.yml 产出 coverage.xml 后上报，
#       CNB 侧的测试与覆盖率上报（testing:coverage）已移除，Codecov 为唯一覆盖率来源。

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    # 项目整体覆盖率：允许小幅波动，避免无关改动的 PR 被卡
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    # 本次变更的增量覆盖率：新增代码应当带测试
    patch:
      default:
        target: auto
        threshold: 5%
        informational: true

# 覆盖率构成（供 Codecov 页面展开查看）
# 路径口径：CI 用 `python -m tests.run_coverage`，其 --source 传包名，SF 仍写成
# 相对检出根的 `client.py` / `main.py`，故此处无需再加包名前缀。
# 排除口径分两层，互不替代：pyproject.toml 的 coverage.report.omit 决定**算不算**
# （tests/ 与 ai-audit/），本文件的 ignore 只决定**上传后显示哪些**（仅 tests/ 与
# 安装脚本，ai-audit/ 不在此处重复配置）；Codecov 的 ignore 管不到本地裸跑。
flags:
  unittests:
    paths:
      - client.py
      - main.py
    carryforward: true

# 忽略非业务代码，避免拉低口径
ignore:
  - "tests/"
  - "install_gpg_keys.sh"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
