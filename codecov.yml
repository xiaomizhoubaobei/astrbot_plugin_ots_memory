# Codecov 配置：覆盖率报告口径与门禁策略
# 说明：本项目覆盖率由 .github/workflows/coverage.yml 产出 coverage.xml 后上报，
#       CNB 侧的测试与覆盖率上报（testing:coverage）已移除，Codecov 为唯一覆盖率来源。

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    # 项目整体覆盖率：允许小幅波动，避免无关改动的 PR 被卡
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    # 本次变更的增量覆盖率：新增代码应当带测试
    patch:
      default:
        target: auto
        threshold: 5%
        informational: true

# 覆盖率构成（供 Codecov 页面展开查看）
# 路径口径：coverage 用「包名」--source 计数，SF 写成相对检出根的
# `client.py` / `main.py`，故此处无需再加包名前缀；tests/ 与 ai-audit/
# 已在 pyproject.toml 的 coverage.report.omit 中排除，相同规则再写一遍，
# 以防有人绕过工程配置裸跑 coverage。
flags:
  unittests:
    paths:
      - client.py
      - main.py
    carryforward: true

# 忽略非业务代码，避免拉低口径
ignore:
  - "tests/"
  - "install_gpg_keys.sh"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
