name: Coverage

# 触发时机：main 分支的推送与 PR。
# 说明：本仓库代码会在 main 推送时由 CNB（.cnb.yml）同步至本 GitHub 镜像仓库，
#       因此 CNB 侧的每次变更最终都会以 push 形式落到这里，覆盖率随之更新；
#       pull_request 仅用于 PR 场景的覆盖率对比（Codecov 会给出 diff 覆盖）。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一分支/PR 的旧运行自动取消，避免重复上报造成徽章抖动
concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  coverage:
    name: 单元测试与覆盖率 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 测试矩阵：CI 只在「当前受支持的 3.13 / 3.14 / 3.15」上跑单测，
    # 逐个版本覆盖是为了尽早暴露版本相关的行为差异（如 asyncio 事件循环、
    # 标准库弃用告警），而不是只在一个版本上「绿了就算过」。
    # fail-fast: false —— 某一版本失败不该掩盖其它版本的结论。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    # 令牌经 job 级 env 暴露给步骤的条件表达式（secrets 不能直接写在 if 中），
    # 从而在 token 为空时安全跳过上报步骤。
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      # 安全加固：与仓库内其余全部工作流一致，内联 step-security/harden-runner。
      # 本工作流会在 PR（不可信来源）场景运行仓库自带测试代码，属高风险面，
      # 故必须补齐该审计 Action；egress-policy: audit 仅审计出网调用，
      # 保持"记录不阻断"的既有策略，与其它工作流口径统一。
      - name: 加固运行器 (审计全部出网调用)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本 job 会执行 PR 可控的测试代码，凭据不得留在本地 git 配置里被读取外泄
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 拉取 AstrBot 官方源码
        run: |
          # 宿主一律取自上游官方源码，不从 PyPI 装 astrbot（避免与上游代码漂移）。
          # 浅克隆即可：只需能安装与导入，不追溯历史。
          git clone --depth 1 https://github.com/AstrBotDevs/AstrBot.git "$RUNNER_TEMP/astrbot"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 先装宿主源码（editable），它是 main.py 的导入前置：装不上则
          # tests/test_main.py 整片收集失败、main.py 覆盖率归零，故应当直接失败。
          pip install -e "$RUNNER_TEMP/astrbot"
          # 再装本仓库运行依赖 + 测试工具（pytest/pytest-asyncio/coverage 由
          # Dependabot 跟踪）。requirements-dev.txt 已不再声明 astrbot。
          pip install -r requirements-dev.txt

      - name: 运行测试并统计覆盖率
        env:
          # 覆盖率数据文件落到临时目录，避免污染工作区
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          # 包视图（把检出根暴露为顶层包名）由 tests/meta_path.py 的 import hook
          # 提供，与检出目录名无关，不需要往 PYTHONPATH 里塞父目录。
          # 但 coverage 解析 --source 早于 pytest 加载 conftest，故用启动器把
          # 「建包视图 → 启 coverage → 跑 pytest」放进同一个进程，顺序可控。
          python -m tests.run_coverage

          # 兜底自检：没收集到任何覆盖率数据就明确失败，而不是上传一份空报告。
          python -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage.xml').getroot()
          files = [c.get('filename') for c in root.iter('class')]
          assert files, 'coverage.xml 里没有任何文件，包名很可能没被解析到'
          print('覆盖率文件:', files)
          "

      # 上报 Codecov：仅在拿到 token（仓库 Secret 或同名 CNB 密钥）时执行。
      # 未配置 token 时跳过上报，仅留存 coverage.xml 工件，不使 CI 失败。
      - name: 上报覆盖率到 Codecov
        id: codecov
        # 仅当拿到 token 才上报；token 为空时跳过，避免空 token 触发失败
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          # 覆盖率只跑单一版本（矩阵起始的 3.13）：多版本重复上报同一份
          # 源码的覆盖率没有增量信息，只会让 Codecov 侧互相覆盖。
          # 其余版本由下面的 tests 矩阵负责「跑通」这一结论。
          flags: unittests
          name: python-3.13
          fail_ci_if_error: false
          verbose: true

      # 上传覆盖率报告工件，便于人工下载核对。
      - name: 上传覆盖率报告工件
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  # 纯单测矩阵：3.13 / 3.14 / 3.15 逐版本跑一遍 pytest。
  # 为什么与 coverage job 分开：覆盖率只需算一次（同一份源码），
  # 而「代码在这些版本上都能跑通」必须逐版本验证；两者混在一个 job 里
  # 会让覆盖率被重复计算、被重复上报，纯属浪费。
  tests:
    name: 单测 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 某一版本失败不应掩盖其它版本的结果，全部跑完再下结论
    strategy:
      fail-fast: false
      matrix:
        # 测试矩阵就是这一行：3.13 / 3.14 / 3.15。
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - name: 加固运行器 (审计全部出网调用)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 拉取 AstrBot 官方源码
        run: |
          git clone --depth 1 https://github.com/AstrBotDevs/AstrBot.git "$RUNNER_TEMP/astrbot"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e "$RUNNER_TEMP/astrbot"
          pip install -r requirements-dev.txt

      - name: 运行单元测试
        run: |
          # 不走 coverage 启动器：这里只关心「能不能跑通」，
          # 覆盖率统计与上报由上面的 coverage job 负责。
          python -m pytest -q

  # 汇总门禁：分支保护只认这一个检查项，避免每加一个版本都要改一次保护规则。
  # 任一矩阵任务失败 / 被取消，这里都会失败，故不会被单个版本的红灯漏过。
  tests-gate:
    name: 单测矩阵汇总
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    steps:
      - name: 校验矩阵结果
        run: |
          # needs.tests.result 在「至少一个失败」「被取消」时都不是 success，
          # 故这里用严格相等判定，任何非 success 都判失败。
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "❌ 单测矩阵未全部通过：${{ needs.tests.result }}"
            exit 1
          fi
          echo "✅ 3.13 / 3.14 / 3.15 全部通过"
