name: Coverage

# 触发时机：main 分支的推送与 PR。
# 说明：本仓库代码会在 main 推送时由 CNB（.cnb.yml）同步至本 GitHub 镜像仓库，
#       因此 CNB 侧的每次变更最终都会以 push 形式落到这里，覆盖率随之更新；
#       pull_request 仅用于 PR 场景的覆盖率对比（Codecov 会给出 diff 覆盖）。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一分支/PR 的旧运行自动取消，避免重复上报造成徽章抖动
concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  coverage:
    name: 单元测试与覆盖率
    runs-on: ubuntu-latest
    # 令牌经 job 级 env 暴露给步骤的条件表达式（secrets 不能直接写在 if 中），
    # 从而在 token 为空时安全跳过上报步骤。
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      # 安全加固：与仓库内其余全部工作流一致，内联 step-security/harden-runner。
      # 本工作流会在 PR（不可信来源）场景运行仓库自带测试代码，属高风险面，
      # 故必须补齐该审计 Action；egress-policy: audit 仅审计出网调用，
      # 保持"记录不阻断"的既有策略，与其它工作流口径统一。
      - name: 加固运行器 (审计全部出网调用)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本 job 会执行 PR 可控的测试代码，凭据不得留在本地 git 配置里被读取外泄
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 统一从 requirements-dev.txt 安装（含运行依赖 + 测试工具），
          # 使 pytest/pytest-asyncio/coverage 纳入 Dependabot 跟踪范围。
          pip install -r requirements-dev.txt

      - name: 运行测试并统计覆盖率
        env:
          # 覆盖率数据文件落到临时目录，避免污染工作区
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          # 不再依赖 PYTHONPATH 指路：插件包视图由 tests/conftest.py 通过
          # import hook 建立（tests/meta_path.py），与检出目录名无关。
          # 先做一次导入自检——包名解析不到时，coverage 只会警告
          # "Module ... was never imported" 并静默写出空报告，比直接失败更难查。
          python -c "import astrbot_plugin_ots_memory as m; print('包视图:', m.__file__)"

          # --source 用「包名」计数，SF 才会写出相对包目录的路径
          # （如 client.py，<source> 记作检出根）；若改用路径 --source，
          # SF 会退化成 /home/runner/work/... 这类绝对路径，Codecov 匹配不到文件。
          python -m coverage run --source=astrbot_plugin_ots_memory -m pytest tests -q
          python -m coverage report -m
          python -m coverage xml -o coverage.xml

      # 上报 Codecov：仅在拿到 token（仓库 Secret 或同名 CNB 密钥）时执行。
      # 未配置 token 时跳过上报，仅留存 coverage.xml 工件，不使 CI 失败。
      - name: 上报覆盖率到 Codecov
        id: codecov
        # 仅当拿到 token 才上报；token 为空时跳过，避免空 token 触发失败
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: python-3.12
          fail_ci_if_error: false
          verbose: true

      # 上传覆盖率报告工件，便于人工下载核对。
      - name: 上传覆盖率报告工件
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
