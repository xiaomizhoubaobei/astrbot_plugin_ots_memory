# 此工作流使用的操作未获得 GitHub 认证。
# 它们由第三方提供，并受单独的服务条款、隐私政策和支持文档约束。

name: 'DevSkim 多环境分析'

# 不设 paths 过滤：DevSkim 属源码级扫描，YAML/配置同样可能含不安全模式，
# 故对所有变更全量扫描（由 workflow_dispatch 支持补跑）。
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # 支持手动触发，便于排障与补跑
  workflow_dispatch:

# 最小权限：仅需读取仓库内容、写入安全标签（上传 SARIF）与读取 Actions 元数据。
# 本工作流无 OIDC 消费者，不授予 id-token: write。
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    name: DevSkim 源码扫描
    steps:
      - name: 加固运行器（审计所有出站调用）
        # 观察模式：egress-policy 保持 audit，仅记录出网调用、不阻断构建。
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # DevSkim 是源码级静态扫描，Python 版本不改变扫描输入，
      # 故不做多版本矩阵，避免同一结果与 SARIF 重复上传三次。
      - name: 运行 DevSkim 扫描器
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 # v1.0.16

      - name: 上传 DevSkim 扫描结果到 GitHub 安全标签
        uses: github/codeql-action/upload-sarif@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v4.31.9
        with:
          sarif_file: devskim-results.sarif
