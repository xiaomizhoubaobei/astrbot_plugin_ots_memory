# 它们由第三方提供，并受单独的服务条款、隐私政策和支持文档约束。

name: 'Python 依赖审计'

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'
  # 支持手动触发，便于排障与补跑
  workflow_dispatch:

# 最小权限：pip-audit 只读取仓库与依赖清单，不上传 SARIF、也不调用云身份，
# 故**不授予** security-events: write / id-token: write，避免第三方 Action
# 取得不必要的写能力与 OIDC 令牌。
permissions:
  contents: read
  actions: read

jobs:
  audit:
    strategy:
      matrix:
        os: [ubuntu-latest]
        # 与插件声明的 Python 支持范围（>=3.10）保持一致，逐版本审计，
        # 确保 3.10/3.11 上的依赖解析与漏洞结论同样被覆盖。
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    name: 审计在 ${{ matrix.os }} 上使用 Python ${{ matrix.python-version }}

    steps:
      - name: 加固运行器（审计所有出站调用）
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # 不在此处 pip install -r requirements.txt：pip-audit 已直接对清单做
      # 依赖解析与漏洞比对，额外安装只会执行 PR 可修改的依赖脚本，
      # 无谓扩大不可信代码执行面且属重复工作。
      - name: 运行 pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
          vulnerability-service: OSV
          summary: true
