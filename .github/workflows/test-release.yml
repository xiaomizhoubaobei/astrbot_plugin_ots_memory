name: 'Test Release 构建'

# 触发条件：支持手动触发与特定测试分支推送
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅测试打包与生成证据包，不创建正式 Release'
        type: boolean
        default: true
        required: false

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  build:
    name: 构建测试与验证证据包
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # 为签名所必需
      actions: read

    steps:
      # 0. 安全加固
      - name: 加固运行器
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. 设置 Python 环境
      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # 3. 获取版本号和插件名称
      - name: 获取版本号和插件名称
        id: get_info
        run: |
          VERSION=$(grep "^version:" metadata.yaml | awk '{print $2}')
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          PLUGIN_NAME=$(grep "^name:" metadata.yaml | awk '{print $2}')
          echo "plugin_name=$PLUGIN_NAME" >> $GITHUB_OUTPUT
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "::notice::tag v${VERSION} 已存在"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      # 4. 安装依赖
      - name: 安装依赖
        run: |
          if [ -f requirements.txt ] && [ -s requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt 不存在或为空，跳过依赖安装"
          fi

      # 5. 创建插件目录
      - name: 创建插件目录
        run: |
          mkdir -p "${{ steps.get_info.outputs.plugin_name }}"

      # 6. 复制插件文件到构建目录
      - name: 复制插件文件
        run: |
          PLUGIN_NAME="${{ steps.get_info.outputs.plugin_name }}"
          cp main.py "$PLUGIN_NAME/"
          cp metadata.yaml requirements.txt _conf_schema.json "$PLUGIN_NAME/"
          cp __init__.py "$PLUGIN_NAME/"
          cp client.py "$PLUGIN_NAME/"
          cp logo.png "$PLUGIN_NAME/" || true

      # 7. 打包为 zip 文件
      - name: 创建 zip 包
        run: |
          PLUGIN_NAME="${{ steps.get_info.outputs.plugin_name }}"
          zip -r "${PLUGIN_NAME}.zip" "$PLUGIN_NAME/"

      # 8. 生成 Release Notes
      - name: 生成 Release Notes
        id: release_notes
        run: |
          PREVIOUS_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --merged HEAD^ --sort=-v:refname 2>/dev/null | head -n 1 || echo "")
          echo "上一个版本标签: ${PREVIOUS_TAG:-<无>}"
          VERSION=${{ steps.get_info.outputs.version }}

          generate_changelog_from_git() {
            local PREVIOUS_TAG=$1
            local VERSION=$2
            local FEAT="" FIX="" REFACTOR="" DOCS="" TEST="" STYLE="" CHORE="" PERF="" CI="" BUILD="" OTHER=""

            while IFS= read -r commit; do
              type=$(echo "$commit" | sed -nE 's/^([a-z]+)(\([^)]*\))?!?:.*/\1/p')
              msg=$(echo "$commit" | sed -E 's/^([a-z]+)(\([^)]*\))?!?:[[:space:]]*//')

              case "${type:-other}" in
                feat)    FEAT="${FEAT}- ${msg}\n" ;;
                fix)     FIX="${FIX}- ${msg}\n" ;;
                perf)    PERF="${PERF}- ${msg}\n" ;;
                refactor) REFACTOR="${REFACTOR}- ${msg}\n" ;;
                docs)    DOCS="${DOCS}- ${msg}\n" ;;
                test)    TEST="${TEST}- ${msg}\n" ;;
                style)   STYLE="${STYLE}- ${msg}\n" ;;
                ci)      CI="${CI}- ${msg}\n" ;;
                build)   BUILD="${BUILD}- ${msg}\n" ;;
                chore)   CHORE="${CHORE}- ${msg}\n" ;;
                *)       OTHER="${OTHER}- ${msg}\n" ;;
              esac
            done < <(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"%s" --no-merges)

            NOTES="## 📦 Test Release v${VERSION}\n\n"
            [ -n "$FEAT" ] && NOTES="${NOTES}### ✨ 新功能\n\n${FEAT}\n"
            [ -n "$FIX" ] && NOTES="${NOTES}### 🐛 修复\n\n${FIX}\n"
            [ -n "$PERF" ] && NOTES="${NOTES}### ⚡ 性能优化\n\n${PERF}\n"
            [ -n "$REFACTOR" ] && NOTES="${NOTES}### ♻️ 重构\n\n${REFACTOR}\n"
            [ -n "$DOCS" ] && NOTES="${NOTES}### 📝 文档\n\n${DOCS}\n"
            [ -n "$TEST" ] && NOTES="${NOTES}### ✅ 测试\n\n${TEST}\n"
            [ -n "$STYLE" ] && NOTES="${NOTES}### 💄 样式\n\n${STYLE}\n"
            [ -n "$CI" ] && NOTES="${NOTES}### 👷 CI\n\n${CI}\n"
            [ -n "$BUILD" ] && NOTES="${NOTES}### 📦 构建\n\n${BUILD}\n"
            [ -n "$CHORE" ] && NOTES="${NOTES}### 🔧 杂项\n\n${CHORE}\n"
            [ -n "$OTHER" ] && NOTES="${NOTES}### 其他\n\n${OTHER}\n"

            if [ "$NOTES" = "## 📦 Test Release v${VERSION}\n\n" ]; then
              NOTES="${NOTES}无更新内容\n"
            fi
            echo -e "$NOTES"
          }

          if [ -z "$PREVIOUS_TAG" ]; then
            NOTES="## 🎉 测试构建 v${VERSION}\n\n这是测试工作流构建。"
          else
            NOTES=$(generate_changelog_from_git "$PREVIOUS_TAG" "$VERSION")
          fi

          RELEASE_FOOTER="\n\n---\n\n### 📥 测试安装说明\n\n本构建为测试流水线自动生成。\n"
          NOTES="${NOTES}${RELEASE_FOOTER}"
          echo -e "$NOTES" > release_notes.md
          {
            echo 'notes<<EOF'
            cat release_notes.md
            echo EOF
          } >> $GITHUB_OUTPUT

      # 9. 生成证据包（使用 xiaomizhoubaobei/ci-evidence-pack）
      - name: 生成证据包
        if: always()
        uses: xiaomizhoubaobei/ci-evidence-pack@deb80fb9cc60e07bb686acb3ea36031494b9b3b2
        with:
          sign: 'true'

      # 10. 上传构建成果工件（供测试下载核验）
      - name: 上传构建与证据包产物
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-release-artifacts
          path: |
            ${{ steps.get_info.outputs.plugin_name }}.zip
            _evidence_dist/*.tar.gz
            _evidence_dist/*.sig
            _evidence_dist/*.crt
            release_notes.md
          if-no-files-found: warn
